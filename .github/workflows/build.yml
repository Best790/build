      - name: Find and Build with Gradle or Ant
        run: |
          # Ищем, где находится папка с проектом после распаковки
          find . -maxdepth 3 -name "gradlew"
          
          # Если найден gradlew, запускаем стандартную сборку Gradle
          GRADLE_PATH=$(find . -name "gradlew" -maxdepth 3 | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_PATH")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "Gradle wrapper not found, compiling with custom flags..."
            mkdir -p build_output
            find . -name "*.java" > sources.txt
            # Компилируем с игнорированием устаревших API и варнингов
            javac -Xlint:none -d build_output @sources.txt || true
            jar cvf app.jar -C build_output .
            
            sudo apt-get update && sudo apt-get install -y google-android-build-tools zip
            d8 --output dex_out.zip app.jar || true
            mkdir -p apk_structure
            unzip -o dex_out.zip -d apk_structure/ || true
            cd apk_structure
            zip -r ../app-debug.apk .
          fi
