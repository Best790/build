name: Build APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch LFS files
        run: git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip java.zip
        run: |
          if [ -f "java.zip" ]; then
            unzip -o java.zip
          fi

      - name: Prepare Environment
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          
          # Генерируем минимальный google-services.json
          JSON_CONTENT='{"project_info": {"project_number": "1234567890", "project_id": "parker-mobile"}, "client": [{"client_info": {"mobilesdk_app_id": "1:1234567890:android:1234567890", "android_client_info": {"package_name": "ru.parkermobile.game"}}}]}'
          find . -type d -name "src" | while read src_dir; do
            mkdir -p "$src_dir/main"
            echo "$JSON_CONTENT" > "$src_dir/main/google-services.json"
          done

      - name: Build with Detailed Logging
        run: |
          GRADLE_PATH=$(find . -name "gradlew" -maxdepth 4 | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_PATH")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            # Запускаем с выводом подробных ошибок компилятора javac
            ./gradlew assembleDebug --info --stacktrace --no-daemon
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-apk
          path: |
            **/build/outputs/apk/debug/*.apk
