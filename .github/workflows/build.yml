name: Build APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch LFS files
        run: git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip java.zip
        run: |
          if [ -f "java.zip" ]; then
            unzip -o java.zip
          fi

      - name: Prepare Project and Fix JVM Options
        run: |
          # 1. Настраиваем local.properties
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          find . -type f -name "local.properties" -exec sh -c 'echo "sdk.dir=/usr/local/lib/android/sdk" > "$1"' _ {} \;

          # 2. УДАЛЯЕМ MaxPermSize изо всех файлов gradle.properties
          find . -type f -name "gradle.properties" | while read file; do
            sed -i '/MaxPermSize/d' "$file" || true
            sed -i 's/-XX:MaxPermSize=[^ ]*//g' "$file" || true
          done

          # 3. Добавляем compileSdkVersion 34 и отключаем линт
          find . -type f -name "build.gradle" | while read file; do
            sed -i '/google-services/d' "$file" || true
            sed -i '/com.google.gms/d' "$file" || true
            sed -i '/crashlytics/d' "$file" || true
            sed -i '/firebase/d' "$file" || true
            
            if ! grep -q "compileSdkVersion" "$file" && ! grep -q "compileSdk" "$file"; then
              sed -i '/android {/a \    compileSdkVersion 34\n    buildToolsVersion "34.0.0"\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }' "$file" || true
            fi
            
            sed -i '/storeFile/d' "$file" || true
            sed -i '/storePassword/d' "$file" || true
            sed -i '/keyAlias/d' "$file" || true
            sed -i '/keyPassword/d' "$file" || true
            sed -i '/signingConfig /d' "$file" || true
          done

          # 4. Создаем заглушку google-services.json
          JSON_CONTENT='{"project_info": {"project_number": "1234567890", "project_id": "parker-mobile"}, "client": [{"client_info": {"mobilesdk_app_id": "1:1234567890:android:1234567890", "android_client_info": {"package_name": "ru.parkermobile.game"}}}]}'
          find . -type d -name "src" | while read src_dir; do
            mkdir -p "$src_dir/main"
            echo "$JSON_CONTENT" > "$src_dir/main/google-services.json"
          done

          # 5. Создаем отсутствующие заглушки ресурсов
          find . -type d -name "res" | while read res_dir; do
            mkdir -p "$res_dir/drawable" "$res_dir/animator"
            if [ -d "$res_dir/layout" ]; then
              grep -roh '@drawable/[a-zA-Z0-9_]*' "$res_dir/layout" 2>/dev/null | sed 's/@drawable\//\./g' | while read drw; do
                drw_name=$(echo "$drw" | tr -d '.')
                if [ -n "$drw_name" ] && [ ! -f "$res_dir/drawable/$drw_name.xml" ] && [ ! -f "$res_dir/drawable/$drw_name.png" ]; then
                  echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#00000000"/></shape>' > "$res_dir/drawable/$drw_name.xml"
                fi
              done
            fi
          done

      - name: Build Android APK with Gradle
        run: |
          GRADLE_PATH=$(find . -name "gradlew" -maxdepth 4 | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_PATH")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug -Pandroid.compileSdkVersion=34 --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-apk
          path: |
            **/build/outputs/apk/debug/*.apk
