name: Build APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch LFS files
        run: git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip java.zip
        run: |
          if [ -f "java.zip" ]; then
            unzip -o java.zip
          fi

      - name: Prepare Project and Inject Valid Stubs
        run: |
          # 1. Исправляем local.properties под стандартный путь Android SDK в Ubuntu
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          find . -type f -name "local.properties" -exec sh -c 'echo "sdk.dir=/usr/local/lib/android/sdk" > "$1"' _ {} \;

          # 2. Очищаем устаревшие флаги JVM
          find . -type f -name "gradle.properties" | while read file; do
            sed -i '/MaxPermSize/d' "$file" || true
          done

          # 3. Настраиваем build.gradle (compileSdk 34 и отключение проверки ошибок lint)
          find . -type f -name "build.gradle" | while read file; do
            if ! grep -q "compileSdkVersion" "$file" && ! grep -q "compileSdk" "$file"; then
              sed -i '/android {/a \    compileSdkVersion 34\n    buildToolsVersion "34.0.0"\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }' "$file" || true
            fi
            
            # Удаляем жестко прописанные пути ключей подписи
            sed -i '/storeFile/d' "$file" || true
            sed -i '/storePassword/d' "$file" || true
            sed -i '/keyAlias/d' "$file" || true
            sed -i '/keyPassword/d' "$file" || true
            sed -i '/signingConfig /d' "$file" || true
          done

          # 4. Генерируем правильный google-services.json для пакета ru.parkermobile.game
          JSON_CONTENT='{
            "project_info": { "project_number": "1234567890", "project_id": "parker-mobile", "storage_bucket": "parker-mobile.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:1234567890:android:1234567890", "android_client_info": { "package_name": "ru.parkermobile.game" } },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly12345" }],
              "services": { "analytics_service": { "status": 1 } }
            }],
            "configuration_version": "1"
          }'

          FIND_JSON=$(find . -name "google-services.json")
          if [ -n "$FIND_JSON" ]; then
            echo "$FIND_JSON" | while read gjson; do
              echo "$JSON_CONTENT" > "$gjson"
            done
          else
            find . -type d -name "src" | while read src_dir; do
              mkdir -p "$src_dir/main"
              echo "$JSON_CONTENT" > "$src_dir/main/google-services.json"
            done
          fi

          # 5. Автоматически создаем недостающие ресурсы drawable и animator
          find . -type d -name "res" | while read res_dir; do
            mkdir -p "$res_dir/drawable" "$res_dir/animator"
            
            for xml_file in "$res_dir/drawable"/*.xml; do
              if [ -f "$xml_file" ]; then
                base_name=$(basename "$xml_file" .xml)
                if [ -f "$res_dir/drawable/$base_name.png" ] || [ -f "$res_dir/drawable/$base_name.webp" ] || [ -f "$res_dir/drawable/$base_name.jpg" ]; then
                  rm -f "$xml_file"
                fi
              fi
            done

            if [ -d "$res_dir/layout" ]; then
              grep -roh '@drawable/[a-zA-Z0-9_]*' "$res_dir/layout" 2>/dev/null | sed 's/@drawable\//\./g' | while read drw; do
                drw_name=$(echo "$drw" | tr -d '.')
                if [ -n "$drw_name" ]; then
                  if [ ! -f "$res_dir/drawable/$drw_name.xml" ] && [ ! -f "$res_dir/drawable/$drw_name.png" ] && [ ! -f "$res_dir/drawable/$drw_name.webp" ] && [ ! -f "$res_dir/drawable/$drw_name.jpg" ]; then
                    echo '<?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#00000000"/></shape>' > "$res_dir/drawable/$drw_name.xml"
                  fi
                fi
              done

              grep -roh '@animator/[a-zA-Z0-9_]*' "$res_dir/layout" 2>/dev/null | sed 's/@animator\//\./g' | while read anim; do
                anim_name=$(echo "$anim" | tr -d '.')
                if [ -n "$anim_name" ] && [ ! -f "$res_dir/animator/$anim_name.xml" ]; then
                  echo '<?xml version="1.0" encoding="utf-8"?><set xmlns:android="http://schemas.android.com/apk/res/android"></set>' > "$res_dir/animator/$anim_name.xml"
                fi
              done
            fi
          done

      - name: Build Android APK with Gradle
        run: |
          GRADLE_PATH=$(find . -name "gradlew" -maxdepth 4 | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_PATH")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug -Pandroid.compileSdkVersion=34 --stacktrace --no-daemon
          else
            echo "Gradlew not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-apk
          path: |
            **/build/outputs/apk/debug/*.apk
