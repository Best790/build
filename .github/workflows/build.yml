name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch LFS files
        run: git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip java.zip
        run: unzip java.zip

      - name: Build APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found, compiling JAR/DEX directly..."
            mkdir -p build_output
            find . -name "*.java" > sources.txt
            if [ -s sources.txt ]; then
              javac -d build_output @sources.txt
              jar cvf app.jar -C build_output .
            else
              cp *.jar app.jar || true
            fi
            
            # Конвертація в Android DEX та пакування в APK
            sudo apt-get update && sudo apt-get install -y google-android-build-tools zip
            d8 --output dex_out.zip app.jar || true
            mkdir -p apk_structure
            unzip -o dex_out.zip -d apk_structure/ || true
            cd apk_structure
            zip -r ../app-debug.apk .
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            *.apk
