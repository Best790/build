name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch LFS files
        run: git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip java.zip
        run: unzip java.zip

      - name: Fix Incompatible JVM Flags
        run: |
          # Удаляем устаревшую опцию MaxPermSize, которая не поддерживается в Java 17
          find . -name "gradle.properties" -exec sed -i '/MaxPermSize/d' {} +
          find . -name "*.gradle" -exec sed -i '/MaxPermSize/d' {} +

      - name: Find and Build Project
        run: |
          GRADLE_PATH=$(find . -name "gradlew" -maxdepth 4 | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_PATH")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "Gradle wrapper not found, compiling with fallback..."
            mkdir -p build_output
            find . -name "*.java" > sources.txt
            javac -Xlint:none -d build_output @sources.txt || true
            jar cvf app.jar -C build_output .
            
            sudo apt-get update && sudo apt-get install -y google-android-build-tools zip
            d8 --output dex_out.zip app.jar || true
            mkdir -p apk_structure
            unzip -o dex_out.zip -d apk_structure/ || true
            cd apk_structure
            zip -r ../app-debug.apk .
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            *.apk
