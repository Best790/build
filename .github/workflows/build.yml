name: Simple Zip Extract

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Unzip file
        run: |
          unzip java.zip -d extracted_project
          ls -la extracted_project

      - name: Create Dummy APK
        run: |
          mkdir -p output
          echo "Placeholder APK" > output/app-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: extracted-files
          path: extracted_project/
