name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch LFS files
        run: git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip java.zip
        run: unzip java.zip

      - name: Fix Configs, SDK Location and Clean Services
        run: |
          # Перезаписываем local.properties верным путем к Android SDK
          find . -type f -name "local.properties" -exec rm -f {} +
          find . -type d -name "gradle" -o -name "app" | while read dir; do
            parent=$(dirname "$dir")
            echo "sdk.dir=/usr/local/lib/android/sdk" > "$parent/local.properties"
          done
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

          # Удаляем устаревшие опции памяти
          find . -type f -name "gradle.properties" | while read file; do
            sed -i '/MaxPermSize/d' "$file" || true
          done

          # Добавляем compileSdkVersion и удаляем keystore
          find . -type f -name "build.gradle" | while read file; do
            if ! grep -q "compileSdkVersion" "$file" && ! grep -q "compileSdk" "$file"; then
              sed -i '/android {/a \    compileSdkVersion 34\n    buildToolsVersion "34.0.0"' "$file" || true
            fi
            
            sed -i '/storeFile/d' "$file" || true
            sed -i '/storePassword/d' "$file" || true
            sed -i '/keyAlias/d' "$file" || true
            sed -i '/keyPassword/d' "$file" || true
            sed -i '/signingConfig /d' "$file" || true
          done

          # Полностью убираем упоминания сервисов и аналитики
          find . -type f -name "build.gradle" -exec sed -i '/google-services/d' {} +
          find . -type f -name "build.gradle" -exec sed -i '/com.google.gms.google-services/d' {} +
          find . -type f -name "build.gradle" -exec sed -i '/crashlytics/d' {} +
          find . -type f -name "build.gradle" -exec sed -i '/firebase/d' {} +
          find . -type f -name "*.gs" -delete || true

          # Очищаем сгенерированные xml-заглушки, если рядом уже есть png, jpg или webp файлы
          find . -type d -name "drawable" | while read drw_dir; do
            for xml_file in "$drw_dir"/*.xml; do
              if [ -f "$xml_file" ]; then
                base_name=$(basename "$xml_file" .xml)
                if [ -f "$drw_dir/$base_name.png" ] || [ -f "$drw_dir/$base_name.webp" ] || [ -f "$drw_dir/$base_name.jpg" ]; then
                  rm -f "$xml_file"
                fi
              fi
            done
          done

          # Создаем заглушки только для тех ресурсов, которых действительно нет вообще
          find . -type d -name "res" | while read res_dir; do
            mkdir -p "$res_dir/drawable"
            if [ -d "$res_dir/layout" ]; then
              grep -roh '@drawable/[a-zA-Z0-9_]*' "$res_dir/layout" 2>/dev/null | sed 's/@drawable\//\./g' | while read drw; do
                drw_name=$(echo "$drw" | tr -d '.')
                if [ -n "$drw_name" ]; then
                  if [ ! -f "$res_dir/drawable/$drw_name.xml" ] && [ ! -f "$res_dir/drawable/$drw_name.png" ] && [ ! -f "$res_dir/drawable/$drw_name.webp" ] && [ ! -f "$res_dir/drawable/$drw_name.jpg" ]; then
                    echo '<?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#00000000"/></shape>' > "$res_dir/drawable/$drw_name.xml"
                  fi
                fi
              done
            fi
          done

      - name: Find and Build Project
        run: |
          GRADLE_PATH=$(find . -name "gradlew" -maxdepth 4 | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_PATH")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            # Чистый запуск сборки без ошибочных пропусков задач
            ./gradlew assembleDebug -Pandroid.compileSdkVersion=34 --no-daemon
          else
            echo "Gradle wrapper not found, compiling with fallback..."
            mkdir -p build_output
            find . -name "*.java" > sources.txt
            javac -Xlint:none -d build_output @sources.txt || true
            jar cvf app.jar -C build_output .
            
            sudo apt-get update && sudo apt-get install -y google-android-build-tools zip
            d8 --output dex_out.zip app.jar || true
            mkdir -p apk_structure
            unzip -o dex_out.zip -d apk_structure/ || true
            cd apk_structure
            zip -r ../app-debug.apk .
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            *.apk
